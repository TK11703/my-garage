name: debug-apphost

# Temporary diagnostics for the AppHost smoke tests on Linux; removed once they pass.
on:
  pull_request:
    paths:
      - .github/workflows/debug-apphost.yml

permissions:
  contents: read

jobs:
  apphost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet build tests/MyGarage.AppHost.Tests -c Release
      - name: Trust the ASP.NET Core development certificate
        run: |
          dotnet dev-certs https --trust || true
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"
          ls -la "$HOME/.aspnet/dev-certs/trust" || true
      - name: Run one AppHost test with detailed logging
        timeout-minutes: 6
        continue-on-error: true
        env:
          Logging__LogLevel__Default: Debug
          Logging__LogLevel__Microsoft: Warning
          DOTNET_ENVIRONMENT: Development
        run: >
          dotnet test tests/MyGarage.AppHost.Tests -c Release --no-build
          --filter "FullyQualifiedName~ApiAndWeb_StartAndReportHealthy"
          --logger "console;verbosity=detailed"
      - name: Docker state
        if: always()
        run: |
          docker ps -a || true
          docker images || true
          docker info --format '{{.ServerVersion}} {{.OperatingSystem}} {{.Driver}}' || true
      - name: Aspire orchestrator logs
        if: always()
        run: |
          ls -la /tmp | head -50 || true
          for f in $(find /tmp -maxdepth 3 -name '*.log' 2>/dev/null | head -20); do
            echo "=== $f"; tail -n 60 "$f"
          done
